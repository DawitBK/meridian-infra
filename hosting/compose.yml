# The data plane for the hosted SaaS editions: PostgreSQL 18, Valkey (Redis-compatible) and MinIO.
# Every port is bound to 127.0.0.1: nothing here is reachable from the network. The only things
# that leave this machine are the HTTPS tunnel to the three backends, and those talk to this
# stack over loopback. Ports are chosen not to collide with the native PostgreSQL on 5432 or the
# mirror's containers.
#
#   cp .env.example .env     # fill the three passwords (hosting/scripts/setup.ps1 does it for you)
#   docker compose --env-file .env up -d --wait
name: saas-hosting

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      EDAMS_APP_DB_PASSWORD: ${EDAMS_APP_DB_PASSWORD:?set EDAMS_APP_DB_PASSWORD}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5440}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro
    shm_size: 256mb
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - password_encryption=scram-sha-256
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 30

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ['valkey-server', '--requirepass', '${VALKEY_PASSWORD:?set VALKEY_PASSWORD}', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${VALKEY_PORT:-6390}:6379'
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli -a "$$VALKEY_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}

  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9091']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-saasminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports:
      - '127.0.0.1:${MINIO_PORT:-9090}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9091}:9091'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  valkeydata:
  miniodata:
